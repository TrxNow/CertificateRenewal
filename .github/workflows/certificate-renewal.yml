name: Certificate renewal

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "certbot renew --dry-run for all clients (no email, no commit)"
        type: boolean
        default: false

# Flip to "false" when ready for real renewals (emails + commit).
env:
  DEV_MODE: "true"

concurrency:
  group: certificate-renewal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  renew-all-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install certbot
        run: sudo apt-get update && sudo apt-get install -y certbot

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Renew all clients
        env:
          DEV_MODE: ${{ env.DEV_MODE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          LETSENCRYPT_ROOT: ${{ github.workspace }}/data/letsencrypt
        run: |
          extra=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            extra="--dry-run"
          fi
          if [ "$DEV_MODE" = "true" ]; then
            echo "DEV_MODE=true: certbot renew will use --dry-run"
          fi
          python scripts/renew_all.py $extra

      - name: Commit updated certbot data
        if: env.DEV_MODE != 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/letsencrypt/
          if git diff --staged --quiet; then
            echo "No certbot data changes."
          else
            git commit -m "chore: certbot renew"
            git push
          fi
